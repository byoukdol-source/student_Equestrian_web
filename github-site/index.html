<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>학생승마의 모든 것</title>
<style>
  :root{
    /* [2026-08-04 변경] '승마장 감성' 팔레트로 재단장 - 딥그린/새들브라운/크림 톤 */
    --primary:#2F4A3C;
    --on-primary:#F7F3E8;
    --primary-dark:#2B211B;
    --accent:#5A3E2B;
    --bg:#F5F0E6;
    --card:#ffffff;
    --text:#2B211B;
    --muted:#8A7B6C;
    --line:#E8DFD0;
    --danger:#C0392B;
    --header-bg:#2B211B;
    --header-text:#F7F3E8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:#D9CFC0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:430px;
    height:100vh;
    max-height:900px;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(42,32,25,0.22);
  }
  @media (min-width:480px){
    .phone{ border-radius:36px; height:900px; margin:20px 0; border:8px solid #2A2019; }
  }
  /* [2026-08-04 변경] '웹모바일' 느낌으로 개편 - 상단 고정 헤더는 얇게, 메뉴를 상단 탭으로,
     당첨확인 안내문구는 콘텐츠 영역 왼쪽 정렬 줄로 이동 (네이버 스타일 참고) */
  .topbar{
    background:#fff;
    color:var(--text);
    padding:14px 18px 0;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:7px;
    margin:0 0 10px;
  }
  .brand-logo{ width:28px; height:auto; flex-shrink:0; display:block; }
  .topbar h1{
    margin:0;
    font-size:16px;
    font-weight:800;
    color:var(--primary-dark);
    letter-spacing:-0.2px;
  }
  .status-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding:14px 0 14px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
  }
  .status-row .dot{ width:6px;height:6px;border-radius:50%;background:var(--primary); flex-shrink:0; }
  /* [2026-08-04 추가] 당첨확인 후 승마장명·학생명이 채워지면 진하게 강조 */
  .status-row #venueChipText.filled{ font-weight:800; color:var(--primary-dark); }
  .content{
    flex:1;
    overflow-y:auto;
    padding:0 18px calc(28px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .screen{ display:none; animation:fadeSlide .28s ease; }
  .screen.active{ display:block; }
  @keyframes fadeSlide{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
  }
  .card h2{
    margin:0 0 4px;
    font-size:16px;
    color:var(--text);
  }
  .card .sub{
    margin:0 0 14px;
    font-size:12.5px;
    color:var(--muted);
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--text);
    margin:14px 0 6px;
  }
  label:first-of-type{ margin-top:0; }
  input[type="text"], input[type="date"], input[type="tel"], select{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:14.5px;
    background:#F3EDE1;
    color:var(--text);
    font-family:inherit;
  }
  input:focus, select:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .input-triplet{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .input-triplet input{
    width:auto;
    min-width:0;
    padding:12px 4px;
    text-align:center;
    letter-spacing:0.5px;
  }
  .input-triplet .sep{
    flex-shrink:0;
    color:var(--muted);
    font-weight:700;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:13px;
    margin-top:18px;
    background:var(--primary);
    color:var(--on-primary);
    border:none;
    border-radius:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn:active{ background:#23392E; }
  .btn:disabled{ opacity:.6; }
  .btn.secondary{
    background:transparent;
    color:var(--primary-dark);
    border:1.5px solid var(--primary-dark);
  }
  /* [2026-08-05 추가/수정] 당첨확인 결과의 "*보험가입으로 이동해주세요." 문구 옆에 붙는 이동 버튼.
     문구와의 간격을 탭 한 칸 정도로 넉넉하게 띄우고, 버튼도 조금 더 크게 키움. */
  .move-btn-inline{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:7px 16px;
    margin-left:28px;
    background:var(--danger);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    vertical-align:middle;
  }
  .move-btn-inline:active{ opacity:.8; }
  .result-box{
    margin-top:16px;
    padding:16px;
    border-radius:12px;
    background:#EAF2ED;
    border:1px solid #CFE0D6;
    font-size:14px;
    line-height:1.55;
    display:none;
  }
  .result-box.show{ display:block; }
  .result-box .badge{
    display:inline-block;
    background:var(--primary);
    color:var(--on-primary);
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:100px;
    margin-bottom:8px;
  }
  .note{
    font-size:11.5px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.5;
  }
  /* [2026-08-04 추가] 문의 화면 맨 하단 관리자 링크 (눈에 띄지 않게 작고 무채색으로) */
  .admin-link-row{
    text-align:center;
    padding:6px 0 4px;
  }
  .admin-link-row a{
    font-size:11.5px;
    color:var(--muted);
    text-decoration:underline;
  }

  /* [2026-08-03 추가] 포니등급 합격 축하 카드 (당첨확인 결과에 포니등급 값이 있을 때만 표시) */
  .pony-cert-card{
    display:none;
    margin-top:14px;
    padding:18px;
    border-radius:16px;
    background:linear-gradient(135deg, #FBF6EC 0%, #F0E6D6 100%);
    border:1.5px solid var(--primary);
  }
  .pony-cert-card.show{ display:block; }
  .pony-cert-card .pcc-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--primary);
    color:var(--on-primary);
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:100px;
    margin-bottom:10px;
  }
  .pony-cert-card h3{
    margin:0 0 6px;
    font-size:15px;
    color:var(--primary-dark);
  }
  .pony-cert-card .pcc-sub{
    margin:0 0 4px;
    font-size:12.5px;
    color:var(--text);
    line-height:1.5;
  }
  .pony-cert-card .pcc-note{
    margin:0 0 12px;
    font-size:11.5px;
    color:var(--muted);
  }
  .pony-cert-card .pcc-flow-label{
    margin:0 0 6px;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent);
  }
  .pony-cert-card .pcc-steps{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:5px;
  }
  .pony-cert-card .pcc-step{
    background:#fff;
    border:1px solid rgba(43,33,27,0.14);
    padding:5px 9px;
    border-radius:8px;
    font-size:11.5px;
    font-weight:700;
    color:var(--primary-dark);
    white-space:nowrap;
  }
  .pony-cert-card .pcc-arrow{
    color:var(--muted);
    font-size:11px;
  }
  .venue-card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    position:relative;
  }
  .venue-card.selected{
    border-color:var(--primary);
    background:#EAF2ED;
  }
  .venue-card h3{
    margin:0 0 4px;
    font-size:15px;
  }
  .venue-card p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
  }
  .meta-row{
    display:flex;
    gap:6px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .meta-badge{
    font-size:10.5px;
    background:#EDE4D3;
    color:var(--muted);
    padding:3px 8px;
    border-radius:6px;
  }
  /* [2026-08-04 추가] '일정확인' 버튼 - 빨간색으로 강조되는 클릭 가능한 칩 */
  .schedule-chip{
    font-size:10.5px;
    font-weight:700;
    background:#FFEAEA;
    color:var(--danger);
    border:1px solid var(--danger);
    padding:3px 8px;
    border-radius:6px;
    cursor:pointer;
  }
  .guide-image{
    width:100%;
    border-radius:10px;
    display:block;
    cursor:pointer;
  }
  /* [2026-08-04 추가] 안내 이미지를 탭하면 새 탭에서 원본 이미지가 열리도록 만든 래퍼 + 안내문구 */
  .guide-image-wrap{
    margin-bottom:10px;
  }
  .guide-image-hint{
    font-size:11px;
    color:var(--muted);
    margin:4px 0 0;
    text-align:center;
  }
  .venue-card .check{
    position:absolute;
    top:14px;
    right:14px;
    width:22px;
    height:22px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:transparent;
  }
  .venue-card.selected .check{
    border-color:var(--primary);
    background:var(--primary);
    color:var(--on-primary);
  }
  ul.plain{ margin:0; padding-left:18px; font-size:13.5px; line-height:1.7; color:var(--text); }
  ul.plain li{ margin-bottom:4px; }
  .empty-state{
    text-align:center;
    padding:40px 16px;
  }
  .empty-state .emoji{ width:48px; height:auto; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; color:var(--muted); margin:0 0 16px; line-height:1.6; }
  .contact-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .contact-row:last-child{ border-bottom:none; }
  .contact-row span:first-child{ color:var(--muted); }
  .contact-row a, .contact-row span.val{ font-weight:600; color:var(--text); text-decoration:none; }
  /* [2026-08-04 추가] 카카오채널 '바로가기'를 버튼처럼 보이도록 만든 박스 스타일 (카카오 브랜드 노란색) */
  .kakao-box-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:#FEE500;
    color:#391B1B;
    font-weight:800;
    font-size:14.5px;
    padding:13px;
    border-radius:10px;
    text-decoration:none;
    margin-top:10px;
  }
  .kakao-box-btn:active{ opacity:.85; }
  .kakao-box-btn-icon{ font-size:16px; }
  /* [2026-08-05 추가] 호스피아 '바로가기'를 버튼처럼 보이도록 만든 박스 스타일 (파란색) */
  .hospia-box-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:#1d6fe0;
    color:#fff;
    font-weight:800;
    font-size:14.5px;
    padding:13px;
    border-radius:10px;
    text-decoration:none;
    margin-top:10px;
  }
  .hospia-box-btn:active{ opacity:.85; }
  .hospia-box-btn-icon{ font-size:16px; }
  .tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    color:var(--accent);
    background:#E8DCC3;
    padding:3px 8px;
    border-radius:6px;
    margin-bottom:8px;
  }

  /* 안내사항 내부 탭 */
  .subtabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:14px;
    padding-bottom:2px;
  }
  .subtab{
    flex-shrink:0;
    font-size:12.5px;
    font-weight:700;
    padding:8px 13px;
    border-radius:100px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    cursor:pointer;
  }
  .subtab.active{
    background:var(--primary);
    border-color:var(--primary);
    color:var(--on-primary);
  }
  .subtitle{
    font-size:13px;
    font-weight:700;
    color:var(--text);
    margin:14px 0 6px;
  }
  .subtitle:first-child{ margin-top:0; }

  /* 라디오 선택형 옵션 묶음 (예: 포니등급 인증서확인방법) */
  .radio-group{
    background:#F3EDE1;
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    margin-top:8px;
  }
  .radio-group .consent-row{ margin-top:8px; }
  .radio-group .consent-row:first-child{ margin-top:0; }

  /* 계좌 정보 박스 */
  .account-box{
    background:#F3EDE1;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-top:10px;
  }
  .account-box .bank{ font-size:13px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .account-box .num-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .account-box .num{ font-size:15px; font-weight:700; color:var(--primary-dark); letter-spacing:-0.2px; }
  .copy-btn{
    flex-shrink:0;
    font-size:11.5px;
    font-weight:700;
    padding:6px 10px;
    border-radius:8px;
    border:1px solid var(--primary-dark);
    background:#fff;
    color:var(--primary-dark);
    cursor:pointer;
  }
  .copy-btn.copied{ background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
  .account-box .holder, .account-box .amount{ font-size:12px; color:var(--muted); margin-top:5px; }

  .consent-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin-top:14px;
    font-size:12px;
    color:var(--text);
    line-height:1.5;
  }
  .consent-row input{
    width:16px; height:16px; margin-top:2px; flex-shrink:0; accent-color:var(--primary); cursor:pointer;
  }
  .view-link{
    background:none; border:none; padding:0; font-size:11.5px;
    color:var(--primary-dark); text-decoration:underline; cursor:pointer; margin-top:4px; display:inline-block;
  }

  /* 모달 */
  .modal-overlay{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(42,32,25,0.5);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    width:100%;
    max-width:340px;
    max-height:78%;
    background:#fff;
    border-radius:18px;
    padding:18px 16px 16px;
    display:flex;
    flex-direction:column;
  }
  .modal-title{ font-size:14.5px; font-weight:700; margin:0 0 10px; color:var(--text); }
  .modal-body{ overflow-y:auto; font-size:12.5px; line-height:1.6; color:var(--text); }
  .modal-body p{ margin:0 0 10px; }
  .modal-close{
    margin-top:14px; padding:11px; border:none; border-radius:12px;
    background:var(--primary); color:var(--on-primary); font-weight:700; font-size:13.5px; cursor:pointer;
  }

  /* [2026-08-04 변경] 하단 고정 탭바 → 상단 가로 탭 메뉴(네이버 스타일: 밑줄 표시로 현재 탭 강조) */
  /* [2026-08-04 변경] 선택된 탭은 초록 배경이 채워지는 형태로 강조 */
  .tabbar{
    display:flex;
    gap:2px;
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:6px 10px 0;
    overflow-x:auto;
    flex-shrink:0;
  }
  .tab{
    flex:0 0 auto;
    background:none;
    border:none;
    border-radius:9px 9px 0 0;
    padding:11px 13px 10px;
    margin-bottom:-1px;
    color:var(--muted);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .tab.active{
    background:var(--primary);
    color:var(--on-primary);
    font-weight:800;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<div class="phone">

  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" id="brandLogoImg" alt="학생승마 로고">
      <h1>시흥승마힐링체험장_학생승마의 모든 것</h1>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab active" data-tab="winner" onclick="showScreen('winner')">당첨확인</button>
    <button class="tab" data-tab="insurance" onclick="showScreen('insurance')">보험가입</button>
    <button class="tab" data-tab="guide" onclick="showScreen('guide')">승마장 안내</button>
    <button class="tab" data-tab="pony" onclick="showScreen('pony')">포니등급</button>
    <button class="tab" data-tab="contact" onclick="showScreen('contact')">문의</button>
  </div>

  <div class="content">

    <div class="status-row" id="venueChip">
      <span class="dot"></span>
      <span id="venueChipText">당첨확인을 진행해주세요</span>
    </div>

    <!-- 당첨확인 -->
    <section class="screen active" data-screen="winner">
      <div class="card">
        <h2>당첨확인</h2>
        <!-- [2026-08-05 변경] 안내 문구 수정 -->
        <p class="sub">신청한 학생의 이름, 생년월일을 입력하고 당첨여부를 확인하세요.</p>

        <!-- [2026-08-05 삭제] 학교명 입력칸 삭제 (매칭 조건이 이름+생년월일이라 더 이상 필요 없음) -->

        <!-- [2026-08-05 변경] "이름" -> "학생명" -->
        <label for="w-name">학생명</label>
        <input type="text" id="w-name" placeholder="이름을 입력하세요">

        <label>생년월일</label>
        <div class="input-triplet">
          <input type="text" inputmode="numeric" maxlength="4" id="w-birth-0" placeholder="YYYY">
          <span class="sep">-</span>
          <input type="text" inputmode="numeric" maxlength="2" id="w-birth-1" placeholder="MM">
          <span class="sep">-</span>
          <input type="text" inputmode="numeric" maxlength="2" id="w-birth-2" placeholder="DD">
        </div>

        <!-- [2026-08-05 변경] "확인하기" -> "조회하기" -->
        <button class="btn" id="winnerCheckBtn" onclick="checkWinner()">조회하기</button>

        <div class="result-box" id="winnerResult">

  function tripletHtml(idPrefix, segments, placeholders, values){
    return segments.map((len, i) => {
      const val = (values && values[i]) ? escAttr(values[i]) : '';
      const input = `<input type="text" inputmode="numeric" maxlength="${len}" id="${idPrefix}-${i}" placeholder="${placeholders[i]}" value="${val}">`;
      return i === 0 ? input : `<span class="sep">-</span>${input}`;
    }).join('');
  }

  function wireTriplet(idPrefix, segments){
    const inputs = segments.map((_, i) => document.getElementById(`${idPrefix}-${i}`));
    if(inputs.some(el => !el)) return;
    inputs.forEach((el, i) => {
      el.addEventListener('input', () => {
        el.value = el.value.replace(/\D/g,'').slice(0, segments[i]);
        if(el.value.length === segments[i] && i < inputs.length - 1){
          inputs[i+1].focus();
        }
      });
      if(i > 0){
        el.addEventListener('keydown', e => {
          if(e.key === 'Backspace' && el.value === ''){
            inputs[i-1].focus();
          }
        });
      }
    });
  }

  function getTripletValue(idPrefix, segments){
    const vals = segments.map((_, i) => (document.getElementById(`${idPrefix}-${i}`) || {}).value || '');
    if(vals.every((v, i) => v.length === segments[i])) return vals.join('-');
    return '';
  }

  function clearTriplet(idPrefix, segments){

  function loadVenueConfigsFromAdmin(){
    Object.keys(VENUE_ADMIN_CONFIG_URLS).forEach(key => {

      if(!url) return;
      fetch(`${url}?action=publicGetConfig`)
        .then(res => res.json())
        .then(data => {
          if(!data || !data.ok) return;
          applyVenueConfig(key, data.config);
          if(selectedVenueKey === key){
            const activeScreen = document.querySelector('.screen.active');
            const activeName = activeScreen && activeScreen.dataset.screen;
            if(['guide','insurance','pony'].includes(activeName)) renderVenueDependent(activeName);

  function formatOpenDate(dateStr){
    const d = new Date(dateStr);
    const days = ['일','월','화','수','목','금','토'];
    const yyyy = d.getFullYear(), mm = d.getMonth()+1, dd = d.getDate(), day = days[d.getDay()];
    const h = d.getHours();
    const ampm = h < 12 ? '오전' : '오후';
    let h12 = h % 12; if(h12 === 0) h12 = 12;
    const min = d.getMinutes();
    const minStr = min === 0 ? '' : `:${String(min).padStart(2,'0')}`;
    return `${yyyy}년 ${mm}월 ${dd}일(${day}) ${ampm} ${h12}시${minStr}`;
  }

  function submitInsurance(e){
    e.preventDefault();
    const v = venues[selectedVenueKey];
    if(!v || !v.webappUrl){
      alert('아직 이 승마장의 접수 시스템이 연결되지 않았어요. 잠시 후 다시 시도하시거나 승마장에 직접 문의해주세요.');
      return false;
    }
    const stuName = document.getElementById('stuName');
    const stuSsn = document.getElementById('stuSsn');
    const stuAddress = document.getElementById('stuAddress');
    const stuSchool = document.getElementById('stuSchool');
    const guardianName = document.getElementById('guardianName');
    const guardianBirthVal = getTripletValue('guardianBirth', [4,2,2]);
    const guardianPhoneVal = getTripletValue('guardianPhone', [3,4,4]);
    const consent1 = document.getElementById('insuranceConsent1');
    const btn = e.target.querySelector('button[type="submit"]');

    if(!stuName.value.trim() || !stuSsn.value.trim() || !stuAddress.value.trim() || !stuSchool.value.trim()
      || !guardianName.value.trim() || !guardianBirthVal || !guardianPhoneVal){
      alert('입력하지 않은 항목이 있어요. 참가학생·법정대리인 정보를 모두 채워주세요.');
      return false;
    }
    if(!consent1.checked){
      alert('서약사항 및 개인정보 동의 체크가 필요해요.');
      return false;
    }

    const originalText = btn.textContent;
    btn.disabled = true; btn.textContent = '전송 중...';

    const submittedStudentInfo = { name: stuName.value, school: stuSchool.value };

    const body = new URLSearchParams();
    body.append('form','insurance');
    body.append('stuName', stuName.value);
    body.append('stuSsn', stuSsn.value);
    body.append('stuAddress', stuAddress.value);
    body.append('stuSchool', stuSchool.value);
    body.append('guardianName', guardianName.value);
    body.append('guardianBirth', guardianBirthVal);
    body.append('guardianPhone', guardianPhoneVal);
    body.append('consent', consent1.checked ? 'Y' : 'N');

    const insuranceScreenEl = document.querySelector('.screen[data-screen="insurance"] .card');

    fetch(v.webappUrl, { method:'POST', mode:'no-cors', body })
      .then(() => {
        if(v.classTimeBooking && insuranceScreenEl){
          renderClassTimeBooking(insuranceScreenEl, v, submittedStudentInfo);
          return;
        }
        btn.textContent = '입력 완료 ✓';
        e.target.reset();
        setTimeout(() => { btn.disabled = false; btn.textContent = originalText; }, 2000);
      })
      .catch(() => {
        alert('전송 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
        btn.disabled = false; btn.textContent = originalText;
      });
    return false;

  function renderClassTimeBooking(el, v, studentInfo){
    el.innerHTML = `
      <span class="tag">${v.name}</span>
      <h2>수업시간 선택</h2>
      <p class="note">확인 중...</p>

  function fetchClassTimeClaim(v, studentInfo){
    const bookingUrl = v.classTimeBookingUrl || v.webappUrl;
    const qs = new URLSearchParams({ action: 'getClassTimeClaim', name: studentInfo.name || '', school: studentInfo.school || '' });
    return fetch(`${bookingUrl}?${qs.toString()}`)
      .then(res => res.json())
      .then(data => (data && data.ok && data.claimed) ? { claimed: true, slot: data.slot } : { claimed: false })
      .catch(() => ({ claimed: false }));
  }

  function loadClassTimeClaimStatus(el, v, studentInfo){
    fetchClassTimeClaim(v, studentInfo).then(result => {
      if(result.claimed){
        renderClassTimeAlreadyClaimed(el, v, studentInfo, result.slot);
      } else {
        renderClassTimeSelectUI(el, v, studentInfo);
      }
    });
  }

  function renderClassTimeAlreadyClaimed(el, v, studentInfo, slot){
    el.innerHTML = `
      <span class="tag">${v.name}</span>
      <h2>수업시간 선택</h2>
      <p class="sub">${escAttr(studentInfo.name || '')}님은 <b>${escAttr(slot || '')}</b>로 수업시간을 선택하였습니다. 수정하시겠습니까?</p>
      <button type="button" class="btn secondary" id="classTimeEditBtn">수정하기</button>
      <p class="note" style="margin-top:16px;">${v.payment && v.payment.desc ? v.payment.desc : '체험비(보험가입비 포함) 입금 정보는 아래 계좌로 부탁드립니다.'}</p>

  function renderClassTimeSelectUI(el, v, studentInfo){
    el.innerHTML = `
      <span class="tag">${v.name}</span>
      <h2>수업시간 선택</h2>
      <p class="sub">보험가입정보가 접수되었습니다. 아래에서 수업시간을 선택해주세요. (선착순 마감)</p>

      <button type="button" class="btn secondary" id="classTimeRefreshBtn" style="margin-top:10px;">새로고침</button>
      <p class="note" id="classTimeResultMsg" style="margin-top:10px;"></p>
      <p class="note" style="margin-top:16px;">${v.payment && v.payment.desc ? v.payment.desc : '체험비(보험가입비 포함) 입금 정보는 아래 계좌로 부탁드립니다.'}</p>

    document.getElementById('classTimeRefreshBtn').addEventListener('click', () => loadClassTimeSlots(v, studentInfo));
    loadClassTimeSlots(v, studentInfo);

  function loadClassTimeSlots(v, studentInfo){
    const wrap = document.getElementById('classTimeSlotsWrap');
    if(!wrap) return;
    wrap.innerHTML = `<p class="note">수업시간 정보를 불러오는 중...</p>`;
    const bookingUrl = v.classTimeBookingUrl || v.webappUrl;
    fetch(`${bookingUrl}?action=getClassTimeAvailability`)
      .then(res => res.json())
      .then(data => {
        if(!data || !data.ok || !data.slots){
          wrap.innerHTML = `<p class="note">수업시간 정보를 불러오지 못했어요. 새로고침을 눌러 다시 시도해주세요.</p>`;
          return;
        }
        wrap.innerHTML = `<div class="radio-group">` + data.slots.map((s, i) => `
          <div class="consent-row" style="justify-content:space-between;align-items:center;${i === 0 ? 'margin-top:0;' : ''}">
            <span style="display:flex;align-items:center;gap:8px;">
              <input type="radio" name="classTimeSlot" id="classTimeSlot-${i}" value="${escAttr(s.label)}"${s.remaining <= 0 ? ' disabled' : ''}>
              <label for="classTimeSlot-${i}">${s.label}</label>
            </span>
            <span style="${s.remaining <= 0 ? 'color:#d64545;' : ''}font-size:12px;">${s.remaining <= 0 ? '마감' : `잔여 ${s.remaining}/${s.capacity}명`}</span>
          </div>
        `).join('') + `</div><button type="button" class="btn" id="classTimeClaimBtn">선택 완료</button>`;
        document.getElementById('classTimeClaimBtn').addEventListener('click', () => claimClassTime(v, studentInfo));
      })
      .catch(() => {
        wrap.innerHTML = `<p class="note">수업시간 정보를 불러오지 못했어요. 새로고침을 눌러 다시 시도해주세요.</p>`;
      });
  }

  function claimClassTime(v, studentInfo){
    const selected = document.querySelector('input[name="classTimeSlot"]:checked');
    const msgEl = document.getElementById('classTimeResultMsg');
    if(!selected){
      msgEl.style.color = '#d64545';
      msgEl.textContent = '수업시간을 선택해주세요.';
      return;
    }
    const btn = document.getElementById('classTimeClaimBtn');
    btn.disabled = true; btn.textContent = '처리 중...';

    const body = new URLSearchParams();
    body.append('form', 'classTime');
    body.append('slot', selected.value);
    body.append('name', studentInfo.name || '');
    body.append('school', studentInfo.school || '');

    const bookingUrl = v.classTimeBookingUrl || v.webappUrl;
    fetch(bookingUrl, { method:'POST', body })
      .then(res => res.json())
      .then(data => {
        if(data && data.ok){
          msgEl.style.color = '#2b8a3e';
          if(data.unchanged){
            msgEl.textContent = `"${selected.value}" 시간으로 이미 접수되어 있습니다.`;
          } else if(data.changed){
            msgEl.textContent = `"${selected.value}" 시간으로 수정 완료되었습니다!`;
          } else {
            msgEl.textContent = `"${selected.value}" 시간으로 접수 완료되었습니다!`;
          }
          document.getElementById('classTimeSlotsWrap').innerHTML = '';
          document.getElementById('classTimeRefreshBtn').style.display = 'none';
        } else {
          msgEl.style.color = '#d64545';
          msgEl.textContent = (data && data.error) || '접수에 실패했어요. 다른 시간을 선택해주세요.';
          loadClassTimeSlots(v, studentInfo);
        }
      })
      .catch(() => {
        msgEl.style.color = '#d64545';
        msgEl.textContent = '통신 오류가 발생했어요. 다시 시도해주세요.';
        btn.disabled = false; btn.textContent = '선택 완료';
      });
  }

  function submitPony(e){
    e.preventDefault();
    const v = venues[selectedVenueKey];
    if(!v || !v.webappUrl){
      alert('아직 이 승마장의 접수 시스템이 연결되지 않았어요. 잠시 후 다시 시도하시거나 승마장에 직접 문의해주세요.');
      return false;
    }
    const nameInput = document.getElementById('ponyName');
    const birthVal = getTripletValue('ponyBirth', [4,2,2]);
    const consent1 = document.getElementById('ponyConsent1');
    const consent2 = document.getElementById('ponyConsent2');
    const verifyMethodInput = document.querySelector('input[name="ponyVerifyMethod"]:checked');
    const gradeSelect = document.getElementById('ponyGradeSelect');
    const btn = e.target.querySelector('button[type="submit"]');

    if(!nameInput.value.trim() || !birthVal){
      alert('입력하지 않은 항목이 있어요. 이름과 생년월일을 모두 채워주세요.');
      return false;
    }
    if(!verifyMethodInput){
      alert('본인확인 방법을 선택해주세요.');
      return false;
    }
    if(gradeSelect && v.ponyPricing && v.ponyPricing.length > 1 && !gradeSelect.value){
      alert('응시 등급을 선택해주세요.');
      return false;
    }
    if(!consent1.checked){
      alert('개인정보의 제3자 제공 동의 체크가 필요해요.');
      return false;
    }

    const originalText = btn.textContent;
    btn.disabled = true; btn.textContent = '접수 중...';

    const body = new URLSearchParams();
    body.append('form','pony');
    body.append('name', nameInput.value);
    body.append('birth', birthVal);
    body.append('verifyMethod', verifyMethodInput.value);
    if(gradeSelect && v.ponyPricing){
      const grade = v.ponyPricing[parseInt(gradeSelect.value, 10)];
      body.append('grade', grade ? grade.grade : '');
    }
    body.append('consent1', consent1.checked ? 'Y' : 'N');
    body.append('consent2', consent2.checked ? 'Y' : 'N');

    fetch(v.webappUrl, { method:'POST', mode:'no-cors', body })
      .then(() => {
        btn.textContent = '접수 완료 ✓';
        nameInput.value=''; clearTriplet('ponyBirth', [4,2,2]); consent1.checked=false; consent2.checked=false; verifyMethodInput.checked=false;
        setTimeout(() => { btn.disabled = false; btn.textContent = originalText; }, 2000);
      })
      .catch(() => {
        alert('접수 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
        btn.disabled = false; btn.textContent = originalText;
      });
    return false;
  }

  function copyAccount(btn, text){
    function showCopied(){
      const original = btn.textContent;
      btn.textContent = '복사됨';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
    } else {
      fallbackCopy(text, showCopied);
    }
  }
  function fallbackCopy(text, onDone){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); onDone(); }
    catch(e){ alert('복사에 실패했어요. 직접 선택해서 복사해주세요.'); }
    document.body.removeChild(ta);
  }

  const WINNER_LOOKUP_URL = '/.netlify/functions/check-winner';

  function checkWinner(){
    const school = '';
    const name = document.getElementById('w-name').value.trim();
    const birth = getTripletValue('w-birth', [4,2,2]);
    const box = document.getElementById('winnerResult');
    const text = document.getElementById('winnerResultText');
    const btn = document.getElementById('winnerCheckBtn');

    if(!name || !birth){
      box.classList.add('show');
      text.innerHTML = '이름, 생년월일을 모두 입력해주세요.';
      return;
    }

    winnerInfo = { school, name, birth };
    submissionCheckCache = { insurance: null, pony: null };

    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '조회 중...';
    box.classList.add('show');
    text.innerHTML = '명단을 확인하고 있어요...';

    const url = `${WINNER_LOOKUP_URL}?action=checkWinner&school=${encodeURIComponent(school)}&name=${encodeURIComponent(name)}&birth=${encodeURIComponent(birth)}`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        if(data && data.found){
          selectedVenueKey = data.venue && data.venue.indexOf('월드') !== -1 ? 'world'
            : data.venue && data.venue.indexOf('청초') !== -1 ? 'cheongchowon'
            : 'siheung';
          winnerInfo.school = data.school || school;
          winnerInfo.status = data.status || '';
          winnerInfo.ponyGrade = data.ponyGrade || '';       winnerInfo.course = data.course || '';       winnerInfo.course = data.course || '';
          startSubmissionPrefetch();
          document.getElementById('venueChipText').textContent = venues[selectedVenueKey].name + '(' + name + ')';
          document.getElementById('venueChipText').classList.add('filled');
          const certLine = hasPonyCertification() ? `<br>인증서 : <b>${winnerInfo.ponyGrade}</b>` : '';
          const isWinnerStatus = getStudentCategory() !== null;
          const winnerMoveNote = isWinnerStatus ? `<br><span style="color:var(--danger);font-weight:800;">*보험가입으로 이동해주세요.</span><button type="button" class="move-btn-inline" onclick="showScreen('insurance')">이동하기</button>` : '';
          text.innerHTML = `🎉 당첨을 축하합니다!<br>이름 : <b>${name}</b><br>학교 : <b>${escAttr(winnerInfo.school)}</b><br>배정 승마장 : <b>${venues[selectedVenueKey].name}</b><br>당첨반 : <b>${data.winClass || '-'}</b><br>과정 : <b>${escAttr(winnerInfo.course) || '-'}</b><br>진행상황 : <b>${data.status || '-'}</b>${certLine}${winnerMoveNote}`;
        } else {
          text.innerHTML = `명단에서 <b>${name}</b>님을 찾지 못했어요. 이름·생년월일을 다시 확인해주시거나, 담당자에게 문의해주세요.`;
        }
      })
      .catch(() => {
        text.innerHTML = `명단 조회에 연결하지 못했어요. 잠시 후 다시 시도해주시거나 담당자에게 문의해주세요.`;
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }
